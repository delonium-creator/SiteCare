name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: Apply D1 migrations — main worker
        run: npx wrangler d1 migrations apply sitecare-ketedes-page169452909-db --remote

      - name: Apply D1 migrations — gateway worker
        working-directory: gateway
        run: npx wrangler d1 migrations apply sitecare-telegram-gateway-db --remote

      - name: Deploy main worker
        run: npx wrangler deploy

      - name: Deploy gateway worker
        working-directory: gateway
        run: npx wrangler deploy
